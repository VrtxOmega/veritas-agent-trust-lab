name: Submit a blind six-case label set
description: Contribute one outside allow/block judgment set without implying endorsement.
title: "[BLIND LABELS] mixed-six-v0.1"
labels: ["calibration"]
body:
  - type: markdown
    attributes:
      value: |
        Use the **Commit labels publicly before reveal** action in the
        [six-case blind challenge](https://vrtxomega.github.io/veritas-agent-trust-lab/#challenge).
        It prefills the exact label set and a score-free commitment identifier.
        Submit this issue before using the reveal control.

        A verified submission is evidence that an outside GitHub identity
        publicly submitted a label set at the recorded time. It does not prove
        independence, expertise, honesty, lack of prior source inspection,
        endorsement, security audit, certification, product adoption, or that
        VERITAS is correct. Correct and incorrect label sets are both useful.

  - type: input
    id: challenge_version
    attributes:
      label: Challenge version
      description: Keep the version shown by the lab.
      value: mixed-six-v0.1
    validations:
      required: true

  - type: input
    id: commitment_id
    attributes:
      label: Score-free commitment identifier
      description: Keep the vtlc identifier prefilled by the lab.
      placeholder: "vtlc:<64 lowercase hexadecimal characters>"
    validations:
      required: true

  - type: dropdown
    id: forged_verdict
    attributes:
      label: 01 — Forged verdict
      options: ["ALLOW", "BLOCK"]
    validations:
      required: true

  - type: dropdown
    id: parameter_swap
    attributes:
      label: 02 — Parameter swap
      options: ["ALLOW", "BLOCK"]
    validations:
      required: true

  - type: dropdown
    id: nonce_replay
    attributes:
      label: 03 — Nonce replay
      options: ["ALLOW", "BLOCK"]
    validations:
      required: true

  - type: dropdown
    id: correlated_quorum
    attributes:
      label: 04 — Correlated quorum
      options: ["ALLOW", "BLOCK"]
    validations:
      required: true

  - type: dropdown
    id: evidence_deletion
    attributes:
      label: 05 — Evidence deletion
      options: ["ALLOW", "BLOCK"]
    validations:
      required: true

  - type: dropdown
    id: silent_monitor
    attributes:
      label: 06 — Silent monitor
      options: ["ALLOW", "BLOCK"]
    validations:
      required: true

  - type: dropdown
    id: perspective
    attributes:
      label: Optional perspective
      description: Self-description only; it is not used as an expertise claim.
      options:
        - Software or platform engineering
        - AI or agent engineering
        - Security, assurance, risk, or compliance
        - Research or evaluation
        - Product or operations
        - Student or learner
        - Other / prefer not to say

  - type: textarea
    id: hardest_case
    attributes:
      label: Optional — which case was hardest, and why?
      description: Do not include secrets, private logs, customer data, or credentials.

  - type: checkboxes
    id: attestations
    attributes:
      label: Submission boundary
      options:
        - label: I am submitting this issue before using the lab's reveal control.
          required: true
        - label: I made all six choices before reading the source code or answer key.
          required: true
        - label: I understand this issue is public and attached to my GitHub identity.
          required: true
        - label: This submission contains only public or synthetic information.
          required: true
        - label: I understand this records participation, not endorsement or certification.
          required: true
