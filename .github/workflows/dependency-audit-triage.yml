name: Dependency audit triage
on:
  push:
    branches: [fix/dependency-audit-20260927]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture current audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          node --version | tee audit/node-version.txt
          npm --version | tee audit/npm-version.txt
          date -u +%FT%TZ | tee audit/retrieved-at.txt
          set +e
          npm audit --package-lock-only --json > audit/npm-audit-before.json
          echo $? > audit/npm-audit-before.exit
          npm outdated --json > audit/npm-outdated.json
          echo $? > audit/npm-outdated.exit
          set -e
      - name: Generate targeted direct-dependency repair candidate
        shell: bash
        run: |
          set -euo pipefail
          cp package.json audit/package.before.json
          cp package-lock.json audit/package-lock.before.json
          npm pkg set overrides.image-size=2.0.3
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit --save-exact \
            next@16.3.6 \
            vinext@0.2.1 \
            @vitejs/plugin-rsc@0.5.35 \
            @cloudflare/vite-plugin@1.61.0 \
            wrangler@4.142.0
          cp package.json audit/package.candidate.json
          cp package-lock.json audit/package-lock.candidate.json
          git diff -- package.json package-lock.json > audit/candidate.patch
          set +e
          npm audit --package-lock-only --json > audit/npm-audit-after-candidate.json
          echo $? > audit/npm-audit-after-candidate.exit
          set -e
      - name: Verify candidate install and project gates
        shell: bash
        run: |
          set +e
          npm ci > audit/candidate-npm-ci.stdout.txt 2> audit/candidate-npm-ci.stderr.txt
          CI_RC=$?
          if [ "$CI_RC" -eq 0 ]; then npm run lint > audit/candidate-lint.stdout.txt 2> audit/candidate-lint.stderr.txt; LINT_RC=$?; else LINT_RC=99; fi
          if [ "$CI_RC" -eq 0 ]; then npm test > audit/candidate-test.stdout.txt 2> audit/candidate-test.stderr.txt; TEST_RC=$?; else TEST_RC=99; fi
          if [ "$CI_RC" -eq 0 ]; then npm run build:pages > audit/candidate-pages.stdout.txt 2> audit/candidate-pages.stderr.txt; PAGES_RC=$?; else PAGES_RC=99; fi
          printf 'npm_ci=%s\nlint=%s\ntest=%s\npages=%s\n' "$CI_RC" "$LINT_RC" "$TEST_RC" "$PAGES_RC" | tee audit/candidate-verification.txt
          exit 0
      - name: Upload triage bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-audit-triage
          path: audit/
          retention-days: 30
          if-no-files-found: error
