name: Pinned tolegm source capture
on:
  push:
    branches: [work/tolegm-source-capture-20260927]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public git objects without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          mkdir -p sources
          git clone --quiet --no-checkout https://github.com/VrtxOmega/veritas-agent-trust-lab.git lab
          git -C lab bundle create ../sources/lab.bundle --all
          sha256sum sources/lab.bundle > sources/SHA256SUMS
      - name: Upload source history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tolegm-public-git-history
          path: sources/
          retention-days: 30
          if-no-files-found: error
