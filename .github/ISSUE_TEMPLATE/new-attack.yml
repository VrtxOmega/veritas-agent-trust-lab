name: Submit an external hostile-case candidate
description: Propose or execute a falsifiable agent-decision failure mode.
title: "[ATTACK] "
labels: ["proposed-attack"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a narrow failure case that can be represented with synthetic data.
        Do not include secrets, private logs, customer data, or live credentials.

        This enters the **external candidate corpus**. It does not automatically
        become a seventh canonical challenge case, count as validation, establish
        expertise or independence, or imply endorsement.
  - type: dropdown
    id: operation_class
    attributes:
      label: Consequential operation class
      options:
        - Repository push, merge, or release
        - Package publication
        - Credential or secret access
        - Production or infrastructure change
        - External message or transaction
        - Destructive file operation
        - Other
    validations:
      required: true
  - type: textarea
    id: unsafe_confusion
    attributes:
      label: What unsafe confusion does the case expose?
      placeholder: "Example: a valid signature is mistaken for evidence that the signer told the truth."
    validations:
      required: true
  - type: textarea
    id: clean_fixture
    attributes:
      label: What would the clean fixture contain?
    validations:
      required: true
  - type: textarea
    id: hostile_mutation
    attributes:
      label: What single hostile mutation should make it fail closed?
    validations:
      required: true
  - type: textarea
    id: expected_safe_outcome
    attributes:
      label: What exact safe outcome should the evaluator produce?
      placeholder: "BLOCK with no execution authority, because..."
    validations:
      required: true
  - type: input
    id: expected_reason
    attributes:
      label: Expected reason code
      placeholder: "EXACT_TARGET_MISMATCH"
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why is this meaningfully different from the six current cases?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can an independent reviewer reproduce or evaluate it?
      description: Use public or synthetic inputs only.
    validations:
      required: true
  - type: textarea
    id: conflict_disclosures
    attributes:
      label: Conflicts, relationships, or prior collaboration
      description: State none if there are none.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Public-data boundary
      options:
        - label: This proposal contains only public or synthetic information.
          required: true
        - label: I understand this is a candidate-corpus submission, not automatic validation or canonical challenge inclusion.
          required: true
